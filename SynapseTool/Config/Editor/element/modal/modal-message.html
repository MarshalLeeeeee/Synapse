<div class="modal">
    <div class="modal-header">
        <div class="modal-title" id="messageModalTitle">Title</div>
        <load-element id="messageModalBtnClose">
            <data-loader>addButton</data-loader>
            <data-class>close</data-class>
            <data-text>&times;</data-text>
            <data-css-path>css/btn/close.css</data-css-path>
        </load-element>
    </div>
    <div class="modal-body">
        <p id="messageModalMessage">Message</p>
    </div>
    <div class="modal-footer">
        <load-element id="messageModalBtnConfirm">
            <data-loader>addButton</data-loader>
            <data-class>primary</data-class>
            <data-text>Ok</data-text>
            <data-css-path>css/btn/primary.css</data-css-path>
        </load-element>
    </div>
</div>
