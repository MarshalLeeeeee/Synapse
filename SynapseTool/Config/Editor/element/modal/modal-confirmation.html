<div class="modal">
    <div class="modal-header">
        <div class="modal-title" id="confirmationModalTitle">Confirm Action</div>
        <load-element id="confirmationModalBtnClose">
            <data-loader>addButton</data-loader>
            <data-class>close</data-class>
            <data-css-path>css/btn/close.css</data-css-path>
        </load-element>
    </div>
    <div class="modal-body">
        <p id="confirmationModalMessage">Are you sure you want to perform this action?</p>
    </div>
    <div class="modal-footer">
        <load-element id="confirmationModalBtnCancel">
            <data-loader>addButton</data-loader>
            <data-class>cancel</data-class>
            <data-css-path>css/btn/cancel.css</data-css-path>
        </load-element>
        <load-element id="confirmationModalBtnConfirm">
            <data-loader>addButton</data-loader>
            <data-class>warning</data-class>
            <data-css-path>css/btn/warning.css</data-css-path>
        </load-element>
    </div>
</div>
