<div class="config-file-header">
    <div class="config-file-name" id="configFileName"></div>
    <div class="config-file-header-controls">
        <load-element id="versionSelector">
            <data-loader>addSelect</data-loader>
            <data-class>plain</data-class>
            <data-css-path>css/selector/plain.css</data-css-path>
        </load-element>
        <load-element id="configSaveBtn">
            <data-loader>addButton</data-loader>
            <data-class>primary</data-class>
            <data-element-path>element/btn/btn-fas.html</data-element-path>
            <data-css-path>css/btn/primary.css</data-css-path>
        </load-element>
    </div>
</div>

<div id="configDynamicToolbar" class="config-dynamic-toolbar"></div>

<table class="config-table" id="configTable">
    <thead>
        <tr id="configTableHeader"></tr>
    </thead>
    <tbody id="configTableBody">
    </tbody>
</table>
